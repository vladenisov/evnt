name: CI

on:
  pull_request:
  # Pushes to main and v* tags run this through release.yml, as the gate in
  # front of publishing the image.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v6
      with:
        # The Iglu schemas are a submodule; tests validate payloads against them.
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    # --locked, not --frozen: --locked fails when pyproject.toml has moved ahead
    # of uv.lock; --frozen would silently install the stale lock.
    - name: Install dependencies
      run: uv sync --locked --all-extras

    # No path arguments: scope comes from pyproject.toml, exactly like
    # `make lint-be`, so CI and the Makefile cannot drift apart.
    - name: Ruff
      run: |
        uv run ruff check
        uv run ruff format --check

    - name: Mypy
      run: uv run mypy

    # Integration tests run in their own job against real backends.
    - name: Pytest
      run: >-
        uv run pytest -q -n auto -m "not integration"
        --cov=evnt --cov-report=term-missing:skip-covered

  integration:
    name: Integration (ClickHouse + RabbitMQ)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.9
        env:
          CLICKHOUSE_USER: evnt
          CLICKHOUSE_PASSWORD: evnt
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
        - 8123:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 10s --health-retries 20
    env:
      # A skip here would mean the job passed while testing nothing.
      EVNT_IT_REQUIRED: "1"
      EVNT_IT_CLICKHOUSE_HOST: 127.0.0.1
      EVNT_IT_CLICKHOUSE_USER: evnt
      EVNT_IT_CLICKHOUSE_PASSWORD: evnt
      EVNT_IT_RABBITMQ_HOST: 127.0.0.1
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --all-extras

    - name: Pytest (integration)
      run: uv run pytest -q -m integration --junitxml=integration.xml

    # Belt and braces for EVNT_IT_REQUIRED: fail if any test was skipped or
    # none ran at all (e.g. a marker typo deselecting everything).
    - name: Nothing skipped
      run: |
        python3 - <<'EOF'
        import xml.etree.ElementTree as ET
        suite = next(ET.parse("integration.xml").getroot().iter("testsuite"))
        tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
        print(f"integration: {tests} tests, {skipped} skipped")
        raise SystemExit(tests == 0 or skipped > 0)
        EOF

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v6

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: frontend/.bun-version

    # vue-tsc's compiler hooks and Vitest's V8 coverage need Node.
    # Vite development and production builds run on Bun.
    - uses: actions/setup-node@v5
      with:
        node-version-file: frontend/.node-version

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Typecheck
      run: bun run typecheck

    - name: Test (with coverage)
      run: bun run test:coverage

    - name: Build
      run: bun run build

  documentation:
    name: Docs (typecheck + build + links)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
    - uses: actions/checkout@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: website/package.json
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Typecheck
      run: bun run typecheck
    - name: Build (including link validation)
      run: bun run build

  image:
    name: Build the image (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    # Before this job the Dockerfile first ran on push to main, after merge.
    # amd64 only and no push: this gate is about whether the image builds.
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: .
        target: runtime
        platforms: linux/amd64
        push: false
        load: true
        tags: evnt:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The image must at least load its settings and import the app as the
    # non-root user it ships with.
    - name: Smoke test
      run: |
        docker run --rm evnt:ci evnt settings > /dev/null
        docker run --rm evnt:ci python -c "import evnt.main"

    # Backend delivery is covered by the integration job. This exercises the
    # shipped Uvicorn entrypoint and public assets with no backend connection.
    - name: HTTP smoke test
      run: |
        docker run -d --name evnt-ci-http \
          -e EVNT_COMMON__DEMO=true -e EVNT_PROMETHEUS__ENABLED=true \
          evnt:ci uvicorn evnt.main:app --host 0.0.0.0 --port 8000 --lifespan off
        trap 'docker rm -f evnt-ci-http' EXIT
        docker exec -i evnt-ci-http python - <<'PY'
        import time
        import urllib.request

        base = "http://127.0.0.1:8000"
        for attempt in range(40):
            try:
                with urllib.request.urlopen(base + "/live", timeout=1) as response:
                    assert response.status == 204
                break
            except OSError:
                time.sleep(0.5)
        else:
            raise SystemExit("API did not start")
        for path, content_type in [
            ("/metrics", "text/plain"),
            ("/static/sp/sp.js", "javascript"),
            ("/demo/", "text/html"),
            ("/demo/tables", "text/html"),
        ]:
            print(f"Checking {path}", flush=True)
            request = urllib.request.Request(base + path, headers={"Accept": "text/html" if content_type == "text/html" else "*/*"})
            with urllib.request.urlopen(request, timeout=5) as response:
                assert response.status == 200, path
                assert content_type in response.headers["content-type"], path
                assert response.read(), path
        PY
