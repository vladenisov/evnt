name: Publish docs

# One-time repository setup: Settings -> Pages -> Source = GitHub Actions.
# PR builds run in ci.yml; this workflow publishes the project site.
on:
  push:
    branches: [main]
    paths:
    - 'website/**'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: website/package.json
    - run: bun install --frozen-lockfile
    - run: bun run typecheck
    - run: bun run build
    - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
      with:
        path: website/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    # Enable the site once in Settings -> Pages -> Source = GitHub Actions.
    # configure-pages cannot enable it using the default GITHUB_TOKEN.
    - name: Check GitHub Pages configuration
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
