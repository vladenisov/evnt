changelog:
  exclude:
    labels: [skip-changelog]
  categories:
  - title: Breaking changes
    labels: [breaking-change, breaking]
  - title: Features
    labels: [enhancement, feature, feat]
  - title: Fixes
    labels: [bug, fix]
  - title: Documentation
    labels: [documentation, docs]
  - title: Dependencies
    labels: [dependencies]
  - title: Other changes
    labels: ['*']
