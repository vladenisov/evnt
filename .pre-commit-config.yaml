# `make install-hooks`. Ruff takes its settings from backend/pyproject.toml
# (it walks up from each file), so the hook and `make lint-be` cannot disagree.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-ast
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.9
  hooks:
  - id: ruff-check
    args: [--fix, --exit-non-zero-on-fix]
  - id: ruff-format

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --preserve-quotes, --indent=2]
    exclude: ^frontend/pnpm-lock\.yaml$
