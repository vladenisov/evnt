[project]
name = "evnt"
version = "0.6.0"
description = "A tiny self-hosted event collector. Speaks the Snowplow tracker wire protocol, persists to ClickHouse, optional RabbitMQ buffer, single-container deploy."
license = "BSD-3-Clause"
authors = [{ name = "Vladislav Denisov" }]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.0",
    "asgi-correlation-id>=4.3.4",
    "brotli-asgi>=1.6.0",
    "clickhouse-connect[async,tzdata]>=1.10.0",
    "crawlerdetect>=0.4.2",
    "fastapi>=0.143.0",
    "fastapi-structlog>=0.7.1",
    "fire>=0.7.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "orjson>=3.13.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    # fastapi-structlog imports sqlalchemy.ext.asyncio, which requires greenlet.
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=25.5.0",
    "ua-parser[regex]>=1.0.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# `uv sync --extra apm`. Required when EVNT_ELASTIC_APM__ENABLED=true; without
# it, evnt.observability.tracing falls back to no-op span decorators and
# enabling APM fails at startup with a clear error.
apm = ["elastic-apm>=6.26.2"]
# `uv sync --extra sentry`. Required when EVNT_SENTRY__ENABLED=true.
sentry = ["sentry-sdk[fastapi]>=2.71.0"]
# `uv sync --extra crypto`. Required when EVNT_ENCRYPTION__ENABLED=true;
# without it, startup fails with a clear error and `/e` is never mounted.
crypto = ["cryptography>=50.0.2"]

[project.scripts]
evnt = "evnt.cli:main"

[dependency-groups]
# Installed by a plain `uv sync`; the Docker image passes --no-dev.
dev = [
    # Mirrors the `crypto` extra so the encrypted-ingest tests run on a plain
    # `uv sync` instead of being skipped.
    "cryptography>=50.0.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evnt"]
exclude = ["src/evnt/tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Fixtures embed long Iglu URIs and payloads.
"src/evnt/tests/**" = ["E501", "PLC0415", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["evnt"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/evnt"]
exclude = ["src/evnt/tests/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information shipped.
module = ["brotli_asgi.*", "clickhouse_connect.*", "crawlerdetect.*", "elasticapm.*", "fire.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/evnt/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    # src/evnt/tests/integration: a real ClickHouse (and RabbitMQ). They SKIP
    # when unreachable; CI sets EVNT_IT_REQUIRED=1 so a skip fails the job.
    "integration: runs against real ClickHouse/RabbitMQ (EVNT_IT_* env vars)",
]
filterwarnings = [
    # clickhouse_connect's Cython buffer module uses `array.array('u', ...)`,
    # deprecated since Python 3.13. Emitted during import, so it cannot be
    # pinned to the module name. Third-party issue, not ours.
    "ignore:The 'u' type code is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["evnt"]
omit = ["*/evnt/tests/*"]

[tool.coverage.report]
# A ratchet: raise it when coverage rises, never lower it to get a red run
# through. pytest-cov reads it, so CI passes no --cov-fail-under of its own.
# Measured with all extras, unit tests only: 87.5% on 2026-10-08.
fail_under = 87
skip_empty = true
