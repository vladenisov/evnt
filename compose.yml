# Local development stack: `make dev` (or `docker compose up --watch`).
#
#   app         the collector on http://localhost:8000 (demo UI at /demo)
#   clickhouse  event storage; HTTP on :8123 (the demo UI queries it directly)
#   rabbitmq    optional ingest buffer, only with `--profile rabbitmq`
#   worker      RabbitMQ -> ClickHouse batch writer, same profile
#
# Create the tables once: `docker compose run --rm app evnt db init`.
x-evnt-image: &evnt-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Space-separated optional extras, e.g. "apm sentry crypto".
      EXTRAS: "${EVNT_BUILD_EXTRAS:-}"
      # "false" skips the Bun stage; /demo then serves a placeholder page.
      BUILD_DEMO: "${EVNT_BUILD_DEMO:-true}"
  image: evnt:dev

services:
  app:
    <<: *evnt-image
    container_name: evnt
    ports:
    - "8000:8000"
    environment:
    - "EVNT_COMMON__DEMO=true"
    - "EVNT_INGEST__MODE=${EVNT_INGEST__MODE:-direct}"
    - "EVNT_LOGGING__LEVEL=DEBUG"
    command: ["uvicorn", "evnt.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy
    develop:
      watch:
      - action: sync
        path: ./backend/src
        target: /app/src
        ignore:
        - evnt/tests/
        - "**/__pycache__/"
      - action: rebuild
        path: ./backend/uv.lock
      - action: rebuild
        path: ./frontend/src

  worker:
    <<: *evnt-image
    container_name: evnt-worker
    environment:
    - "EVNT_LOGGING__LEVEL=DEBUG"
    command: ["evnt", "queue", "worker"]
    restart: on-failure
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "evnt", "queue", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    profiles:
    - rabbitmq

  clickhouse:
    container_name: clickhouse
    image: clickhouse/clickhouse-server:26.9.15.5-alpine
    environment:
    - "CLICKHOUSE_PASSWORD=password"
    ports:
    - "8123:8123"
    - "9000:9000"
    - "9009:9009"
    volumes:
    # Mount individual files (not the whole directory) so we don't shadow the
    # image's docker_related_config.xml (which sets <listen_host>::</listen_host>)
    # nor block the entrypoint from writing users.d/default-user.xml.
    - ./deploy/clickhouse/config.d/cors.xml:/etc/clickhouse-server/config.d/cors.xml:ro
    - ./deploy/clickhouse/users.d/cors.xml:/etc/clickhouse-server/users.d/cors.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "localhost", "--port", "9000", "--user", "default", "--password", "password", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  rabbitmq:
    container_name: evnt-rabbitmq
    image: rabbitmq:4.3-management-alpine
    ports:
    - "5672:5672"
    - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
    - rabbitmq
